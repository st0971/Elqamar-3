<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elqamar</title>
    <link rel="icon" type="image/png" sizes="16x25" href="images/紅印.png">
    <link rel="icon" type="image/png" sizes="32x40" href="images/紅印.png">
    <link rel="stylesheet" href="css/index.css">
</head>


<body>


    <!-- =========================
         導覽列
         ========================= -->

    <header>

        <nav>


            <button
                class="nav-btn active"
                onclick="showPage('poster', this)">

                海報

            </button>


            <button
                class="nav-btn"
                onclick="showPage('business', this)">

                名片

            </button>


            <button
                class="nav-btn"
                onclick="showPage('illustration', this)">

                插畫

            </button>


            <button
                class="nav-btn"
                onclick="showPage('other', this)">

                其他

            </button>


        </nav>

    </header>



    <!-- =====================================================
         主要內容
         ===================================================== -->

    <main>



        <!-- =================================================
             海報
             ================================================= -->

        <section
            id="poster"
            class="page active">


            <h1 class="page-title">

                海報(文案：AI輔助生成)

            </h1>


            <!-- JavaScript 自動產生作品 -->

            <div
                id="poster-gallery"
                class="gallery">
            </div>


            <!-- JavaScript 自動產生頁碼 -->

            <div
                id="poster-pagination"
                class="pagination">
            </div>


        </section>



        <!-- =================================================
             名片
             ================================================= -->

        <section
            id="business"
            class="page">


            <h1 class="page-title">

                名片(文案：AI輔助生成)

            </h1>


            <div
                id="business-gallery"
                class="gallery">
            </div>


            <div
                id="business-pagination"
                class="pagination">
            </div>


        </section>



        <!-- =================================================
             插畫
             ================================================= -->

        <section
            id="illustration"
            class="page">


            <h1 class="page-title">

                插畫

            </h1>


            <div
                id="illustration-gallery"
                class="gallery">
            </div>


            <div
                id="illustration-pagination"
                class="pagination">
            </div>


        </section>



        <!-- =================================================
             其他
             ================================================= -->

        <section
            id="other"
            class="page">


            <h1 class="page-title">

                其他

            </h1>


            <div
                id="other-gallery"
                class="gallery">
            </div>


            <div
                id="other-pagination"
                class="pagination">
            </div>


        </section>


    </main>


    <footer>
        © 2026 Elqamar
    </footer>
    <script>
    // 禁用右鍵
    document.addEventListener('contextmenu', function (e) {
        e.preventDefault();
    });

    // 禁用 F12 與 Ctrl+Shift+I 等
    document.addEventListener('keydown', function (e) {
        if (
        e.key === 'F12' ||
        (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) ||
        (e.ctrlKey && e.key === 'U')
        ) {
        e.preventDefault();
        }
    });
    </script>
    <script src="js/index.js"></script>

    

</body>
</html>
